<!DOCTYPE html>
<html lang="pt">

<head>

    h1 {
      color: #333;

    }

    .card-container {
      display: flex;

      justify-content: center;
      gap: 20px;
    }

      background: #fff;
      border-radius: 15px;
      padding: 25px 20px;
      width: 220px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s, box-shadow 0.3s;
      text-decoration: none;
      color: #fff;
      font-weight: bold;
      font-size: 18px;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .orçamento {
      background: #25D366;
    }

    .duvidas {
      background: #128C7E;
    }

    .promocoes {
      background: #075E54;
    }

    .card span {
      display: block;
      font-size: 35px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
